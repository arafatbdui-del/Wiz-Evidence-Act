name: evidence_act_bd
description: Evidence Act BD - gamified, offline-first learning app for the Bangladesh Evidence Act 1872.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  # Fonts: add Manrope + Noto Sans Bengali .ttf files under assets/fonts/ and declare them here
  # (see docs/README_BUILD.md). Until then the app uses the device's default / Noto Sans Bengali fallback.
